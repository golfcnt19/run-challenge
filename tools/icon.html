<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><title>icon gen</title></head>
<body style="background:#ddd;padding:20px">
<script>
// วาดไอคอนแอปแนวตราสัญลักษณ์กีฬา: พื้นกรมท่า + วงแหวน + pictogram นักวิ่ง
// ใช้ครั้งเดียวตอนสร้างไฟล์ใน icons/ — เปิดผ่าน static server แล้วเรียก window.icons()
function runner(g, s, cx, cy, scale, color) {
  const P = (x, y) => [cx + (x - 0.5) * s * scale, cy + (y - 0.5) * s * scale];
  const w = s * scale * 0.082;
  g.strokeStyle = color; g.fillStyle = color;
  g.lineWidth = w; g.lineCap = "round"; g.lineJoin = "round";
  const line = (...pts) => { g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo : g.moveTo).call(g, ...P(...p))); g.stroke(); };
  const [hx, hy] = P(0.69, 0.18); g.beginPath(); g.arc(hx, hy, s * scale * 0.08, 0, Math.PI * 2); g.fill();
  line([0.63, 0.31], [0.50, 0.55]);                  // ลำตัว
  line([0.62, 0.34], [0.78, 0.43], [0.88, 0.35]);     // แขนหน้า
  line([0.62, 0.34], [0.49, 0.41], [0.40, 0.31]);     // แขนหลัง
  line([0.50, 0.55], [0.69, 0.62], [0.73, 0.83]);     // ขาหน้า
  line([0.50, 0.55], [0.37, 0.72], [0.22, 0.65]);     // ขาหลัง
}
function draw(size, maskable) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  const g = c.getContext("2d");
  // พื้นกรมท่าไล่โทนอ่อน ๆ
  const grad = g.createLinearGradient(0, 0, 0, size);
  grad.addColorStop(0, "#1e3a8a"); grad.addColorStop(1, "#0f1f4d");
  g.fillStyle = grad;
  g.beginPath(); g.roundRect(0, 0, size, size, maskable ? 0 : size * 0.22); g.fill();
  // วงแหวนขาว
  const ring = size * (maskable ? 0.30 : 0.37);
  g.strokeStyle = "rgba(255,255,255,0.9)"; g.lineWidth = size * 0.028;
  g.beginPath(); g.arc(size / 2, size / 2, ring, 0, Math.PI * 2); g.stroke();
  // นักวิ่งในวง
  runner(g, size, size * 0.5, size * 0.52, maskable ? 0.50 : 0.62, "#ffffff");
  c.style.margin = "6px"; document.body.appendChild(c);
  return c.toDataURL("image/png").split(",")[1];
}
window.icons = () => ({
  "apple-touch-icon.png": draw(180, false),
  "icon-192.png": draw(192, false),
  "icon-512.png": draw(512, false),
  "icon-maskable-512.png": draw(512, true),
});
</script></body></html>
