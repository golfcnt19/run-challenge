<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><title>icon gen</title></head>
<body style="background:#333;padding:20px">
<script>
// วาดไอคอนแอป: พื้นไล่สีเหมือน hero + อีโมจิคนวิ่ง
// ใช้ครั้งเดียวตอนสร้างไฟล์ใน icons/ — เปิดผ่าน static server แล้วเรียก window.icons()
function draw(size, maskable) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  const g = c.getContext("2d");
  const grad = g.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, "#4f46e5"); grad.addColorStop(0.6, "#7c3aed"); grad.addColorStop(1, "#d0367a");
  g.fillStyle = grad;
  g.beginPath(); g.roundRect(0, 0, size, size, maskable ? 0 : size * 0.22); g.fill();
  g.font = `${size * (maskable ? 0.5 : 0.62)}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("🏃", size / 2, size / 2 + size * 0.04);
  c.style.margin = "6px"; document.body.appendChild(c);
  return c.toDataURL("image/png").split(",")[1];
}
window.icons = () => ({
  "apple-touch-icon.png": draw(180, false),
  "icon-192.png": draw(192, false),
  "icon-512.png": draw(512, false),
  "icon-maskable-512.png": draw(512, true),
});
</script></body></html>
