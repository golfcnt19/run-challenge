<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Challenge — ตารางคะแนน</title>
<meta name="description" content="ตารางคะแนนกิจกรรมวิ่งสะสมระยะ 7 ทีม">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Run Challenge">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/site.css?v=mtwryrz4">
</head>
<body>

<header class="hero">
  <div class="wrap">
    <p class="hero-kicker">กิจกรรมสะสมคะแนน</p>
    <h1 id="title">Run Challenge</h1>
    <p class="hero-range" id="range">—</p>
    <div class="progress">
      <div class="progress-bar"><span id="progress-fill" style="width:0%"></span></div>
      <div class="progress-meta"><span id="progress-text">—</span><span id="progress-days">—</span></div>
    </div>
    <p class="updated"><span id="updated">กำลังโหลด…</span></p>
    <div class="hero-actions">
      <button class="btn-refresh" id="refresh" type="button" aria-label="โหลดข้อมูลใหม่">↻ รีเฟรช</button>
      <a class="btn-entry" href="entry.html">✏️ กรอกผล</a>
      <a class="btn-entry" href="cards.html">🃏 การ์ด</a>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="alert" id="error" hidden></div>
  <details class="warn" id="warnings" hidden>
    <summary><span id="warn-count"></span> รายการที่ระบบไม่นับ — กดดู</summary>
    <ul id="warn-list"></ul>
  </details>

  <nav class="tabs" role="tablist" aria-label="หน้า">
    <button class="tab is-active" role="tab" data-tab="board" aria-selected="true">🏆 อันดับทีม</button>
    <button class="tab" role="tab" data-tab="daily" aria-selected="false">📈 รายวัน</button>
    <button class="tab" role="tab" data-tab="team" aria-selected="false">👥 รายทีม</button>
  </nav>

  <!-- อันดับทีม -->
  <section class="panel" id="panel-board" role="tabpanel">
    <div class="reveal" id="reveal" hidden></div>
    <ol class="board" id="board"></ol>
    <div class="card track-card">
      <div class="track-head">
        <h2>🏁 สนามแข่ง</h2>
        <div class="seg seg-mini" id="track-mode" role="radiogroup">
          <button type="button" data-v="zoom" class="is-active">🔍 ซูม</button>
          <button type="button" data-v="full">🏁 เต็มสนาม</button>
        </div>
      </div>
      <small class="track-note" id="track-note"></small>
      <div class="track" id="track"></div>
    </div>
    <div class="card" id="week-cards-card">
      <div class="track-head"><h2>🃏 การ์ดวีคนี้</h2><small id="week-cards-range"></small></div>
      <div class="table-scroll"><table class="table week-cards" id="week-cards"></table></div>
    </div>
    <div class="card" id="top-runners-card">
      <h2>⭐ นักวิ่งเด่น</h2>
      <ol class="top-runners" id="top-runners"></ol>
    </div>
    <details class="card rules-card" open>
      <summary><h2>📋 กติกา</h2></summary>
      <ul class="rules" id="rules"></ul>
    </details>
  </section>

  <!-- รายวัน -->
  <section class="panel" id="panel-daily" role="tabpanel" hidden>
    <div class="card" id="day-summary-card">
      <div class="track-head"><h2 id="day-summary-title">สรุปวันล่าสุด</h2><small id="day-summary-date"></small></div>
      <div class="stat-row day-summary" id="day-summary"></div>
      <div class="day-cards" id="day-cards" hidden></div>
    </div>
    <div class="card">
      <h2>ตารางรายวัน</h2>
      <div class="table-scroll"><table class="table" id="daily-table"></table></div>
      <button type="button" class="btn-ghost" id="daily-toggle" hidden>ดูทั้งหมด</button>
    </div>
    <div class="card chart-card">
      <div class="track-head"><h2>📊 คะแนนแต่ละวัน</h2><small>7 วันล่าสุด</small></div>
      <div class="chart-box"><canvas id="chart-daily"></canvas></div>
    </div>
  </section>

  <!-- รายทีม -->
  <section class="panel" id="panel-team" role="tabpanel" hidden>
    <div class="chips" id="team-chips" role="tablist" aria-label="เลือกทีม"></div>
    <div id="team-detail"></div>
  </section>
</main>

<footer class="foot wrap">
  <span id="foot-note"></span>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script type="module" src="js/app.js?v=mtwryrz4"></script>
</body>
</html>
